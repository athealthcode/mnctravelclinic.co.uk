<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Bar Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900">

<!-- TRUST BAR TEST -->
<div style="background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); padding: 80px 20px; min-height: 400px;">
  <h1 style="color: white; text-align: center; font-size: 32px; margin-bottom: 40px;">TRUST BAR TEST - CAN YOU SEE THIS?</h1>
  
  <div style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px;">
    
    <div style="background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px; text-align: center;">
      <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #10b981, #14b8a6); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        <svg style="width: 32px; height: 32px; color: white;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h3 style="color: white; font-size: 18px; font-weight: bold; margin-bottom: 8px;">SAME-DAY</h3>
      <p style="color: #94a3b8; font-size: 14px;">Appointments</p>
    </div>

    <div style="background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px; text-align: center;">
      <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #3b82f6, #06b6d4); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        <svg style="width: 32px; height: 32px; color: white;" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
      </div>
      <h3 style="color: white; font-size: 18px; font-weight: bold; margin-bottom: 8px;">GPhC</h3>
      <p style="color: #94a3b8; font-size: 14px;">Registered</p>
    </div>

    <div style="background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px; text-align: center;">
      <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #8b5cf6, #6366f1); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        <svg style="width: 32px; height: 32px; color: white;" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
        </svg>
      </div>
      <h3 style="color: white; font-size: 18px; font-weight: bold; margin-bottom: 8px;">2 CLINICS</h3>
      <p style="color: #94a3b8; font-size: 14px;">Across Manchester</p>
    </div>

    <div style="background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 32px; text-align: center;">
      <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #f59e0b, #f97316); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        <svg style="width: 32px; height: 32px; color: white;" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M17.707 9.293a1 1 0 010 1.414l-7 7a1 1 0 01-1.414 0l-7-7A.997.997 0 012 10V5a3 3 0 013-3h5c.256 0 .512.098.707.293l7 7zM5 6a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
        </svg>
      </div>
      <h3 style="color: white; font-size: 18px; font-weight: bold; margin-bottom: 8px;">PRICE MATCH</h3>
      <p style="color: #94a3b8; font-size: 14px;">Guarantee</p>
    </div>

  </div>
</div>

</body>
</html>
